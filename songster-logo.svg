<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Songster Logo</title>
  <!-- background circle -->
  <circle cx="200" cy="200" r="165" fill="#FBC914"/>

  <g stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail -->
    <path d="M135 272 Q95 278 102 296 Q130 316 180 298" fill="none"/>

    <!-- body + head + ears -->
    <path d="M130 150 Q124 120 140 98 L162 118 Q187 108 212 114 L230 98 Q248 120 242 150 Q292 178 286 238 Q280 303 205 306 Q125 306 118 240 Q114 182 130 150 Z" fill="#FFF6F4"/>

    <!-- thread -->
    <path d="M205 192 Q245 160 262 112 Q272 88 292 82 Q300 80 297 72 Q290 66 284 74" fill="none"/>

    <!-- yarn ball -->
    <circle cx="190" cy="218" r="30" fill="#9FB5AB"/>
    <path d="M165 205 Q190 220 214 200" fill="none" stroke-width="3"/>
    <path d="M162 222 Q190 238 218 214" fill="none" stroke-width="3"/>
    <path d="M172 242 Q196 244 212 232" fill="none" stroke-width="3"/>

    <!-- paws -->
    <ellipse cx="160" cy="208" rx="13" ry="10" fill="#FFF6F4"/>
    <ellipse cx="224" cy="206" rx="13" ry="10" fill="#FFF6F4"/>

    <!-- belly marks -->
    <path d="M168 272 Q172 258 184 266" fill="none" stroke-width="3.5"/>
    <circle cx="242" cy="262" r="2" fill="#111" stroke="none"/>

    <!-- face -->
    <path d="M178 160 Q188 168 194 160 Q200 168 208 160" fill="none" stroke-width="3"/>
  </g>

  <!-- eyes, nose, cheeks -->
  <circle cx="168" cy="146" r="4" fill="#111"/>
  <circle cx="216" cy="146" r="4" fill="#111"/>
  <ellipse cx="192" cy="152" rx="4" ry="2.6" fill="#111"/>
  <circle cx="152" cy="160" r="9" fill="#F4A3A8" opacity="0.85"/>
  <circle cx="232" cy="160" r="9" fill="#F4A3A8" opacity="0.85"/>
</svg>
